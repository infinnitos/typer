<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TextTools - TyperV2</title>
    <style>
        @import url('https://cdnfonts.com');
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            background-color: #000000; color: #ffffff;
            font-family: "Fixedsys Excelsior", "Fixedsys Excelsior 3.01", "Fixedsys", monospace;
            overflow: hidden; height: 100vh; display: flex; flex-direction: column;
        }
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; border-bottom: 2px dashed #17a2b8;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .app-title { font-size: 36px; color: #17a2b8; }
        .close-btn {
            background-color: #d9534f; color: #ffffff;
            font-family: inherit; font-size: 18px; font-weight: bold;
            border: 1px solid #ffffff; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; user-select: none;
        }
        .close-btn:hover { background-color: #c9302c; }
        .app-body { padding: 15px; flex: 1; overflow-y: auto; }
        .tools-section h3 { color: #f0ad4e; margin-top: 0; }
        .tools-textarea {
            width: 100%; height: 180px; background: #000000; border: 1px solid #17a2b8;
            color: #ffffff; font-family: inherit; font-size: 16px; padding: 10px; outline: none; resize: vertical;
        }
        .stats-bar { margin-top: 8px; color: #17a2b8; font-size: 18px; }
        .tool-btn {
            background: #000000; border: 1px solid #ffffff; color: #ffffff;
            font-family: inherit; font-size: 16px; cursor: pointer; padding: 4px 8px; user-select: none;
        }
        .tool-btn:hover { background: #ffffff; color: #000000; }
    </style>
</head>
<body>
    <div class="app-header">
        <div class="header-left">
            <div class="app-title">TextTools</div>
            <div class="close-btn" onclick="window.location.href='index.html'" title="Exit to Home">X</div>
        </div>
    </div>
    <div class="app-body">
        <div class="tools-section">
            <h3>Text Counter & Case Converter</h3>
            <textarea id="toolsText" class="tools-textarea" placeholder="Paste or type text here..." oninput="updateToolStats()"></textarea>
            <div class="stats-bar" id="toolStats">Characters: 0 | Words: 0 | Lines: 0</div>
            <div style="margin-top: 10px; display: flex; gap: 8px;">
                <button class="tool-btn" onclick="transformText('upper')">UPPERCASE</button>
                <button class="tool-btn" onclick="transformText('lower')">lowercase</button>
                <button class="tool-btn" onclick="transformText('title')">Title Case</button>
            </div>
        </div>
    </div>
    <script>
        function updateToolStats() {
            const txt = document.getElementById('toolsText').value;
            const chars = txt.length;
            const words = txt.trim() ? txt.trim().split(/\s+/).length : 0;
            const lines = txt ? txt.split('\n').length : 0;
            document.getElementById('toolStats').innerText = `Characters: ${chars} | Words: ${words} | Lines: ${lines}`;
        }
        function transformText(type) {
            const area = document.getElementById('toolsText');
            if (type === 'upper') area.value = area.value.toUpperCase();
            if (type === 'lower') area.value = area.value.toLowerCase();
            if (type === 'title') {
                area.value = area.value.toLowerCase().replace(/(?:^|\s)\w/g, match => match.toUpperCase());
            }
            updateToolStats();
        }
    </script>
</body>
</html>
