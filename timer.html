<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Typer Timer - TyperV2</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        @import url('https://cdnfonts.com');
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            background-color: #000000; color: #ffffff;
            font-family: "Fixedsys Excelsior", "Fixedsys Excelsior 3.01", "Fixedsys", monospace;
            overflow: hidden; height: 100vh; display: flex; flex-direction: column;
        }
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; border-bottom: 2px dashed #f0ad4e;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .app-title { font-size: 36px; color: #f0ad4e; }
        .close-btn {
            background-color: #d9534f; color: #ffffff;
            font-family: inherit; font-size: 18px; font-weight: bold;
            border: 1px solid #ffffff; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; user-select: none;
        }
        .close-btn:hover { background-color: #c9302c; }
        .app-body { padding: 15px; flex: 1; overflow-y: auto; }
        .timer-display { font-size: 72px; color: #f0ad4e; margin: 10px 0 20px 0; letter-spacing: 2px; }
        .timer-inputs { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 18px; }
        .time-num-input {
            width: 70px; background: #000000; border: 1px solid #f0ad4e;
            color: #ffffff; font-family: inherit; font-size: 20px; padding: 4px 8px; text-align: center; outline: none;
        }
        .timer-controls { display: flex; gap: 10px; flex-wrap: wrap; }
        .tool-btn {
            background: #000000; border: 1px solid #ffffff; color: #ffffff;
            font-family: inherit; font-size: 16px; cursor: pointer; padding: 4px 8px; user-select: none;
        }
        .tool-btn:hover { background: #ffffff; color: #000000; }
    </style>
</head>
<body>
    <div class="app-header">
        <div class="header-left">
            <div class="app-title">Typer Timer</div>
            <div class="close-btn" onclick="window.location.href='index.html'" title="Exit to Home">X</div>
        </div>
    </div>
    <div class="app-body">
        <div class="timer-display" id="timerDisplay">00:00</div>
        <div class="timer-inputs">
            <label>MIN:</label>
            <input type="number" id="inputMins" class="time-num-input" min="0" max="999" value="5">
            <label>SEC:</label>
            <input type="number" id="inputSecs" class="time-num-input" min="0" max="59" value="0">
            <button class="tool-btn" onclick="setCustomTimer()">SET TIME</button>
        </div>
        <div class="timer-controls">
            <button class="tool-btn" onclick="startTimer()">START</button>
            <button class="tool-btn" onclick="pauseTimer()">PAUSE</button>
            <button class="tool-btn" onclick="resetTimer()">RESET</button>
        </div>
    </div>
    <script>
        let timerSeconds = 300; 
        let initialSeconds = 300;
        let timerInterval = null;
        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
            const secs = (timerSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
        }
        function setCustomTimer() {
            pauseTimer();
            const mins = parseInt(document.getElementById('inputMins').value) || 0;
            const secs = parseInt(document.getElementById('inputSecs').value) || 0;
            timerSeconds = (mins * 60) + secs;
            initialSeconds = timerSeconds;
            updateTimerDisplay();
        }
        function startTimer() {
            if (!timerInterval && timerSeconds > 0) {
                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        updateTimerDisplay();
                    } else {
                        pauseTimer();
                        alert('Timer finished!');
                    }
                }, 1000);
            }
        }
        function pauseTimer() { clearInterval(timerInterval); timerInterval = null; }
        function resetTimer() { pauseTimer(); timerSeconds = initialSeconds; updateTimerDisplay(); }
        updateTimerDisplay();
    </script>
</body>
</html>
