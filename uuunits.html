<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UUUnits - TyperV2</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <style>
        @import url('https://cdnfonts.com');

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: "Fixedsys Excelsior", "Fixedsys Excelsior 3.01", "Fixedsys", monospace;
            overflow: hidden;
            height: 100vh;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 2px dashed #d9534f;
        }

        .app-title { font-size: 36px; }
        .red-text { color: #d9534f; }

        .close-btn {
            background-color: #d9534f;
            color: #ffffff;
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid #ffffff;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .close-btn:hover { background-color: #c9302c; }

        .app-body { padding: 15px; }

        .units-wrapper {
            max-width: 450px;
            border: 1px solid #d9534f;
            padding: 15px;
            background-color: #000000;
        }

        .units-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .units-select, .units-input {
            background: #000000;
            border: 1px solid #ffffff;
            color: #ffffff;
            font-family: inherit;
            font-size: 18px;
            padding: 6px;
            outline: none;
        }

        .units-btn {
            background: #000000;
            border: 1px solid #d9534f;
            color: #d9534f;
            font-family: inherit;
            font-size: 18px;
            cursor: pointer;
            padding: 6px 12px;
        }

        .units-btn:hover {
            background: #d9534f;
            color: #ffffff;
        }

        .units-result {
            font-size: 24px;
            color: #ffffff;
            margin-top: 15px;
            border-top: 1px dashed #d9534f;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="app-title"><span class="red-text">UUU</span>nits</div>
        <div class="close-btn" onclick="window.location.href='index.html'" title="Exit to Home">X</div>
    </div>

    <div class="app-body">
        <div class="units-wrapper">
            <div class="units-row">
                <label style="color:#d9534f; width:100px;">CONVERT:</label>
                <select id="unitMode" class="units-select">
                    <option value="cToF">Celsius to Fahrenheit</option>
                    <option value="fToC">Fahrenheit to Celsius</option>
                    <option value="kmToMi">Kilometers to Miles</option>
                    <option value="miToKm">Miles to Kilometers</option>
                    <option value="kgToLb">Kilograms to Pounds</option>
                    <option value="lbToKg">Pounds to Kilograms</option>
                </select>
            </div>
            <div class="units-row">
                <label style="color:#d9534f; width:100px;">VALUE:</label>
                <input type="number" id="unitVal" class="units-input" value="100" onkeydown="if(event.key==='Enter') convertUnits()">
                <button class="units-btn" onclick="convertUnits()">CALCULATE</button>
            </div>
            <div id="unitResult" class="units-result">Result: --</div>
        </div>
    </div>

    <script>
        function convertUnits() {
            const mode = document.getElementById('unitMode').value;
            const val = parseFloat(document.getElementById('unitVal').value);
            const resDisplay = document.getElementById('unitResult');

            if (isNaN(val)) {
                resDisplay.innerText = 'Result: Invalid Input';
                return;
            }

            let res = 0;
            let unitLabel = '';

            if (mode === 'cToF') { res = (val * 9/5) + 32; unitLabel = '°F'; }
            if (mode === 'fToC') { res = (val - 32) * 5/9; unitLabel = '°C'; }
            if (mode === 'kmToMi') { res = val * 0.621371; unitLabel = 'mi'; }
            if (mode === 'miToKm') { res = val / 0.621371; unitLabel = 'km'; }
            if (mode === 'kgToLb') { res = val * 2.20462; unitLabel = 'lbs'; }
            if (mode === 'lbToKg') { res = val / 2.20462; unitLabel = 'kg'; }

            resDisplay.innerText = `Result: ${res.toFixed(2)} ${unitLabel}`;
        }
    </script>
</body>
</html>
